version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pr_reviewer_backend
    ports:
      - "1806:8000"
    volumes:
      - /mnt/Main/PRreviewer:/data
    env_file:
      - ./backend/.env
    environment:
      - SQLITE_DATABASE=/data/pr_reviewer.db
    extra_hosts:
      - "n8n.nik-server.in:192.168.1.104"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pr_reviewer_frontend
    ports:
      - "1805:80"
    depends_on:
      - backend
    restart: unless-stopped
